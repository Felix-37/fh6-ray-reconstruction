name: Test report / comparison
description: Tell us how it runs on your PC, or share before/after screenshots or videos.
body:
  - type: markdown
    attributes:
      value: |
        Reports that "everything works" are useful too: so far I have only tested the add-on on my own PC.
  - type: input
    id: gpu
    attributes:
      label: GPU, VRAM and driver version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version, resolution, DLSS mode, frame generation
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works, looks better than normal DLSS
        - Works, looks about the same
        - Works, looks worse
        - Does not work (please also open a bug report)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details, performance, screenshots or videos
      description: Same spot with RR on and off (F11). Mention the Game GI mode you used.
